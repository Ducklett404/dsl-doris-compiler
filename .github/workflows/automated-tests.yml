name: automated-acceptance

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python test dependencies
        run: python -m pip install -r scripts/doris/requirements-selftest.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run grammar, semantics, security, snapshots, performance and plugin tests
        run: mvn -B test package
      - name: Test executor module and portable result regressions
        run: |
          mvn -B -f executor-doris/pom.xml test
          python scripts/test_prepare_competition_corpus.py
          python scripts/doris/self-test.py
          python scripts/test_review_regressions.py
          python scripts/accuracy/test_contract_revision.py
          python scripts/doris/test_project_matrix_reference.py
          python scripts/doris/test_project_field_reference.py
          python scripts/doris/check_project_window_boundaries.py --java java --output target/project-window-boundaries-ci.json
          python scripts/doris/check_project_rsi_tail.py --java java --output target/project-rsi-boundaries-ci.json
          python scripts/doris/check_project_availability.py --java java --output target/project-availability-ci.json
          python scripts/doris/check_project_fields.py --java java --output target/project-fields-ci.json
          python scripts/accuracy/check_contract_boundaries.py
          python scripts/accuracy/check_historical_extrema.py
          python scripts/accuracy/check_rolling_averages.py
      - name: Verify frozen contracts with LF and CRLF checkouts
        shell: pwsh
        run: |
          ./scripts/ci/verify-phase1-scope.ps1
          ./scripts/test_scope_freeze.ps1
      - name: Generate formal compiler performance evidence
        run: >-
          java -jar target/dsl-doris-compiler.jar benchmark-stock-slot-compiler
          --warmup 1000 --iterations 5000 --p95-threshold-ms 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-acceptance-evidence
          path: |
            target/surefire-reports/
            executor-doris/target/surefire-reports/
            reports/scope/
            reports/compiler-performance/
            target/project-window-boundaries-ci.json
            target/project-rsi-boundaries-ci.json
            target/project-availability-ci.json
            target/project-fields-ci.json
