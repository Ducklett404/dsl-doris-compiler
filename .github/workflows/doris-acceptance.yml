name: doris-snapshot-acceptance

on:
  workflow_dispatch:
    inputs:
      runNineteenYearBenchmark:
        description: 'Run the 30x hot/process-cold 19-year matrix (very long)'
        required: true
        type: boolean
        default: false

jobs:
  fixed-snapshot-differential:
    runs-on: [self-hosted, Windows, X64, doris-snapshot-v1]
    env:
      DORIS_PASSWORD: ${{ secrets.DORIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python test dependencies
        shell: pwsh
        run: python -m pip install -r scripts/doris/requirements-selftest.txt
      - name: Run fixed-snapshot differential suite
        if: ${{ !inputs.runNineteenYearBenchmark }}
        shell: pwsh
        run: ./scripts/test-all.ps1 -WithDoris
      - name: Run differential suite and full 19-year matrix
        if: ${{ inputs.runNineteenYearBenchmark }}
        shell: pwsh
        run: ./scripts/test-all.ps1 -WithDoris -RunNineteenYearBenchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doris-acceptance-evidence
          path: |
            reports/automation/
            reports/accuracy/
            reports/benchmark-matrix/
            target/project-window-boundaries-*.json
            target/project-rsi-boundaries-*.json
            target/project-availability-*.json
            target/project-fields-*.json
